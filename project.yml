name: DanceTracker
options:
  bundleIdPrefix: com.sakethbalijepalli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  DanceTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DanceTracker
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakethbalijepalli.DanceTracker
        INFOPLIST_FILE: DanceTracker/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
    entitlements:
      path: DanceTracker/DanceTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sakethbalijepalli.DanceTracker
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakethbalijepalli.DanceTracker.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: "YES"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sakethbalijepalli.DanceTracker
